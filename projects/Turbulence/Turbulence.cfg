project = Turbulence
ParticlePopulations = proton

dynamic_timestep = 1

[io]
number_of_recovers = 0
restart_walltime_interval = 258600
restart_write_path = restart
number_of_restarts = 1 # change if modifying time limit or restart interval

diagnostic_write_interval = 10
write_initial_state = 0

system_write_t_interval = 1
system_write_file_name = bulks/test/bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -1.2e6
vx_max = +1.2e6
vy_min = -1.2e6
vy_max = +1.2e6
vz_min = -1.2e6
vz_max = +1.2e6
vx_length = 20
vy_length = 20
vz_length = 20

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 128
y_length = 128
z_length = 1
x_min = 0.0
x_max = 3072e4
y_min = 0.0
y_max = 3072e4
z_min = 0.0
z_max = 240e3
t_max = 10
dt = 0.1

[bailout]
min_dt = 1e-2
velocity_space_wall_block_margin = 1

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
output = vg_b_vol_derivatives
output = populations_vg_ptensor
output = populations_vg_heatflux

diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 50

[fieldsolver]
ohmHallTerm = 1
minCFL = 0.2
maxCFL = 0.25
maxSubcycles = 40
ohmGradPeTerm = 0

[vlasovsolver]
minCFL = 0.4
maxCFL = 0.49
maxSlAccelerationRotation = 10
maxSlAccelerationSubcycles = 10

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[Turbulence]
numberOfWaves = 8

# Wave params
numberOfPossible = 8
amplitude = 1e4 

B = 1e-8
n0 = 1e6
T = 500e3
spectralIndex = -1.67
randomSeed = 94928945
verbose = 1